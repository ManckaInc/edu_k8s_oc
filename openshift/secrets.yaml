# EDU: wspólne sekrety dla OpenShift.
# Wartości szkoleniowe w postaci jawnej (stringData).
# Dla środowiska nieszkoleniowego: oc create secret generic ... --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_DB: ordersdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest

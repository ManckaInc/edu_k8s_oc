apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8c-edu-product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8c-edu-product
  template:
    metadata:
      labels:
        app: k8c-edu-product
    spec:
      containers:
        - name: product-service
          image: product-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: ordersdb

            - name: DB_USERNAME
              value: postgres

            - name: DB_PASSWORD
              value: postgres

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: k8c-edu-product
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
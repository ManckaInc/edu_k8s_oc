# order-service dla OpenShift.
# Różnice względem bazowego order-service.yaml:
# 1. Service — ClusterIP (zamiast NodePort): na zewnątrz wychodzimy przez Route poniżej.
# 2. BD i RabbitMQ — z Secrets (valueFrom), reszta env bez zmian.
# 3. Dodany Route order-service (edge TLS).
# Obraz order-service:1.0 musi być dostępny dla klastra,
# patrz openshift/README.md (warianty: internal registry / oc new-build).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8c-edu-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8c-edu-order
  template:
    metadata:
      labels:
        app: k8c-edu-order
    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_PASS

            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8081

            - name: ORDERS_EXCHANGE
              value: orders.exchange

            - name: ORDERS_CREATED_QUEUE
              value: orders.created.queue

            - name: ORDERS_CANCELLED_QUEUE
              value: orders.cancelled.queue

            - name: ORDER_CREATED_ROUTING_KEY
              value: order.created

            - name: ORDER_CANCELLED_ROUTING_KEY
              value: order.cancelled

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: k8c-edu-order
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: order-service
spec:
  to:
    kind: Service
    name: order-service
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

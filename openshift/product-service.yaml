# product-service dla OpenShift.
# Różnice względem bazowego product-service.yaml:
# 1. Service — ClusterIP (zamiast NodePort): na zewnątrz wychodzimy przez Route poniżej.
# 2. Dostęp do BD — z Secret postgres-credentials (valueFrom).
# 3. Dodany Route product-service (edge TLS): zewnętrzny URL HTTPS zamiast NodePort.
# Obraz product-service:1.0 musi być dostępny dla klastra,
# patrz openshift/README.md (warianty: internal registry / oc new-build).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8c-edu-product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8c-edu-product
  template:
    metadata:
      labels:
        app: k8c-edu-product
    spec:
      containers:
        - name: product-service
          image: product-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: k8c-edu-product
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: product-service
spec:
  to:
    kind: Service
    name: product-service
  port:
    targetPort: 8081
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
